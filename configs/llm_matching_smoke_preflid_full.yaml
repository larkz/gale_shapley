# PrefLID budget-aligned smoke market (4x4)
#
# Aligns PrefLID's sampling budget with the P2ETG/Matching-ID 10K
# budget: each PrefLID iteration draws C(4,2)=6 comparisons for the
# center agent, so max_iterations=1667 -> ~10,002 observations.
#
# Run (PYTHONHASHSEED=0 for cross-process reproducibility):
#   PYTHONHASHSEED=0 python -m llm_matching.cli \
#     --config configs/llm_matching_smoke_preflid_full.yaml \
#     --algorithm preflid --feedback bt
#   PYTHONHASHSEED=0 python -m llm_matching.cli \
#     --config configs/llm_matching_smoke_preflid_full.yaml \
#     --algorithm preflid --feedback replay \
#     --output-dir outputs/llm_matching_smoke_preflid_full_replay

routerbench_root: ../LLMRouterBench

datasets:
  - math500
  - livecodebench
  - finqa
  - medqa

models:
  - DeepSeek-R1-0528-Qwen3-8B
  - Fin-R1
  - Llama-3.1-8B-UltraMedical
  - Qwen2.5-Coder-7B-Instruct

min_aligned_records: 100

split:
  train: 0.60
  val: 0.20
  test: 0.20
  seed: 3407

feedback:
  mode: bt
  target_median_win_probability: 0.70
  replay_gamma: 0.25
  replay_probability_epsilon: 0.01
  model_replay_mode: probabilistic

ties:
  policy: deterministic_jitter
  epsilon: 1.0e-6

p2etg:
  adaptive: true
  check_every: 24
  max_samples: 10000
  constant: 0.1

preflid:
  budget: 100
  # ~10,000 observations: 1667 iterations x 6 comparisons/iteration
  max_iterations: 1667
  constant: 0.1
  max_lattice_vertices: 5000
  min_samples_per_pair: 10
  min_sample_ratio: 0.5

experiment:
  seeds: 20
  random_baseline_seeds: 200

output_dir: outputs/llm_matching_smoke_preflid_full
