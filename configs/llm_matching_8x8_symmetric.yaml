# Original 8x8 market with SYMMETRIC (mirror) preferences
#
# Both sides rank by the SAME shared matrix W = U_d(m): task d's
# preference over models and model m's preference over tasks are
# mirror images. W is tie-free by construction (per-cell deterministic
# SHA256 jitter <= eps/8 breaks row AND column ties jointly), so the
# stable matching is UNIQUE (men-GS == women-GS == mutual-best cascade;
# verified at build time). The learner never sees W directly - it still
# learns from noisy pairwise BT/replay feedback only.
#
#   PYTHONHASHSEED=0 python -m llm_matching.cli bootstrap \
#     --config configs/llm_matching_8x8_symmetric.yaml --num-bootstrap 500
#   PYTHONHASHSEED=0 python -m llm_matching.cli sensitivity \
#     --config configs/llm_matching_8x8_symmetric.yaml
#   PYTHONHASHSEED=0 python -m llm_matching.cli \
#     --config configs/llm_matching_8x8_symmetric.yaml --algorithm p2etg \
#     --feedback bt --seed 0

routerbench_root: ../LLMRouterBench
datasets:
- math500
- livecodebench
- bbh
- mmlupro
- finqa
- medqa
- meld
- korbench
models:
- DeepSeek-R1-0528-Qwen3-8B
- Fin-R1
- Llama-3.1-8B-UltraMedical
- Qwen2.5-Coder-7B-Instruct
- Qwen3-8B
- Llama-3.1-8B-Instruct
- NVIDIA-Nemotron-Nano-9B-v2
- gemma-2-9b-it
min_aligned_records: 100
split:
  train: 0.6
  val: 0.2
  test: 0.2
  seed: 3407
feedback:
  mode: bt
  target_median_win_probability: 0.7
  replay_gamma: 0.25
  replay_probability_epsilon: 0.01
  model_replay_mode: probabilistic
ties:
  policy: deterministic_jitter
  epsilon: 1.0e-06
p2etg:
  adaptive: true
  check_every: 448
  max_samples: 200000
  constant: 0.1
preflid:
  budget: 100
  max_iterations: 200
  constant: 0.1
  max_lattice_vertices: 5000
  min_samples_per_pair: 10
experiment:
  seeds: 30
  random_baseline_seeds: 200
output_dir: outputs/llm_matching_8x8_symmetric
preferences:
  mode: symmetric
