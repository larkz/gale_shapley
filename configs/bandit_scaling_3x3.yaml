# Scaling market 3x3 (floor 0.1, mirror, PrefLID round_robin)
# Greedy distinct-winner selection from the full 20x15 pool.
#   PYTHONHASHSEED=0 python -m llm_matching.cli bandit --config configs/bandit_scaling_3x3.yaml

routerbench_root: ../LLMRouterBench
datasets:
- mbpp
- finqa
- gpqa
models:
- Qwen2.5-Coder-7B-Instruct
- Qwen3-8B
- DeepSeek-R1-0528-Qwen3-8B
min_aligned_records: 100
split:
  train: 0.6
  val: 0.2
  test: 0.2
  seed: 3407
feedback:
  mode: bt
  target_median_win_probability: 0.7
  probability_floor: 0.1
ties:
  policy: deterministic_jitter
  epsilon: 1.0e-06
preferences:
  mode: symmetric
p2etg:
  adaptive: true
  check_every: 18
  max_samples: 200000
  constant: 0.1
preflid:
  budget: 100
  constant: 0.1
  max_lattice_vertices: 5000
  min_samples_per_pair: 10
  min_sample_ratio: 0.5
  center_policy: round_robin
  max_iterations: 66666
experiment:
  seeds: 10
  random_baseline_seeds: 200
output_dir: outputs/bandit_scaling_3x3
